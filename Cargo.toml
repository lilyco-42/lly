[package]
name = "lly"
version = "0.2.1"
edition = "2021"
description = "lilyco 工具包：EdgeTTS / Whisper 转写 / 统一文件处理（Radxa 算力平台）"
license = "MIT OR Apache-2.0"

[dependencies]
# 版本锁定（P0 契约加固）：跟随 lilyco main fe28262f（安全门+遥测+硬件桥就位），升级需显式改此 rev
lilyco = { git = "https://github.com/lilyco-42/lilyco", rev = "fe28262f575c52bb977c282f4992093f8562cb90", default-features = false }
lilyco-core = { git = "https://github.com/lilyco-42/lilyco", rev = "fe28262f575c52bb977c282f4992093f8562cb90" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", features = ["ring"] }
calamine = "0.26"
toml = "0.8"
msedge-tts = "0.4"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
