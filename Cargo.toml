[package]
name = "lly"
version = "0.1.0"
edition = "2021"
description = "lilyco 工具包：EdgeTTS / Whisper 转写 / 统一文件处理（Radxa 算力平台）"
license = "MIT OR Apache-2.0"

[dependencies]
lilyco = { git = "https://github.com/lilyco-42/lilyco", default-features = false }
lilyco-core = { git = "https://github.com/lilyco-42/lilyco" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-webpki-roots", "handshake"] }
rustls = { version = "0.23", features = ["ring"] }
url = "2"
calamine = "0.26"
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
