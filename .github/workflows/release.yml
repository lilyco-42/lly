name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  linux-musl:
    strategy:
      matrix:
        target: [aarch64-unknown-linux-musl, x86_64-unknown-linux-musl]
    runs-on: ubuntu-latest
    container: ghcr.io/rust-cross/cargo-zigbuild:latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: build
        run: cargo zigbuild --release --target ${{ matrix.target }}
      - name: pack
        run: |
          mkdir -p out
          cp target/${{ matrix.target }}/release/lly out/lly-${{ matrix.target }}
          sha256sum out/lly-${{ matrix.target }} > out/lly-${{ matrix.target }}.binary.sha256
          tar czf out/lly-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release lly
          sha256sum out/lly-${{ matrix.target }}.tar.gz > out/lly-${{ matrix.target }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: lly-${{ matrix.target }}
          path: out/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: lly-windows
          path: |
            target/release/lly.exe

  release:
    needs: [linux-musl, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true, path: dist }
      - name: checksums
        run: cd dist && sha256sum lly-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/lly-*
            dist/SHA256SUMS
